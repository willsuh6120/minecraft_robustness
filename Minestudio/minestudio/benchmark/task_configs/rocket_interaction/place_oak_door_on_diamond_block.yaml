time_limit: 150
text: Place the oak door on the diamond block.
custom_init_commands:
  - "/time set day"
  - "/weather clear"
  - "/gamerule doDaylightCycle false"
  - "/give @p minecraft:oak_door 1"
  - "/execute as @p at @s run fill ~-16 ~ ~-16 ~16 ~8 ~16 minecraft:air"
  - "/execute as @p at @s run fill ~-16 ~-1 ~-16 ~16 ~-1 ~16 minecraft:grass_block"
  - "/execute as @p at @s run fill ~-16 ~-4 ~-16 ~16 ~-2 ~16 minecraft:dirt"
  - "/execute as @p at @s run setblock ^-2 ^0 ^4 minecraft:stone"
  - "/execute as @p at @s run setblock ^0 ^0 ^4 minecraft:diamond_block"
  - "/execute as @p at @s run setblock ^2 ^0 ^4 minecraft:coal_block"
