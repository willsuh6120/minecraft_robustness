time_limit: 150
text: Use bucket to get lava.
custom_init_commands:
  - "/time set day"
  - "/weather clear"
  - "/gamerule doDaylightCycle false"
  - "/give @p minecraft:bucket 1"
  - "/execute as @p at @s run fill ~-16 ~ ~-16 ~16 ~8 ~16 minecraft:air"
  - "/execute as @p at @s run fill ~-16 ~-1 ~-16 ~16 ~-1 ~16 minecraft:grass_block"
  - "/execute as @p at @s run fill ~-16 ~-4 ~-16 ~16 ~-2 ~16 minecraft:dirt"
  - "/execute as @p at @s run setblock ^-2 ^-1 ^4 minecraft:water"
  - "/execute as @p at @s run setblock ^-1 ^-1 ^4 minecraft:water"
  - "/execute as @p at @s run setblock ^-2 ^-1 ^3 minecraft:water"
  - "/execute as @p at @s run setblock ^-1 ^-1 ^3 minecraft:water"
  - "/execute as @p at @s run setblock ^1 ^-1 ^4 minecraft:lava"
  - "/execute as @p at @s run setblock ^2 ^-1 ^4 minecraft:lava"
  - "/execute as @p at @s run setblock ^1 ^-1 ^3 minecraft:lava"
  - "/execute as @p at @s run setblock ^2 ^-1 ^3 minecraft:lava"
  - "/execute as @p at @s run setblock ^3 ^-1 ^4 minecraft:dirt"
  - "/execute as @p at @s run setblock ^3 ^-1 ^3 minecraft:dirt"
