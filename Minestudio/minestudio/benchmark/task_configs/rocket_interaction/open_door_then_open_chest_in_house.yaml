time_limit: 180
text: Open the door then open the chest in the house.
custom_init_commands:
  - "/time set day"
  - "/weather clear"
  - "/gamerule doDaylightCycle false"
  - "/execute as @p at @s run fill ~-20 ~ ~-20 ~20 ~8 ~20 minecraft:air"
  - "/execute as @p at @s run fill ~-20 ~-1 ~-20 ~20 ~-1 ~20 minecraft:grass_block"
  - "/execute as @p at @s run fill ~-20 ~-4 ~-20 ~20 ~-2 ~20 minecraft:dirt"
  - "/execute as @p at @s run fill ^-3 ^-1 ^5 ^3 ^2 ^11 minecraft:oak_planks hollow"
  - "/execute as @p at @s run setblock ^0 ^-1 ^5 minecraft:oak_door[facing=south,half=lower,hinge=left,open=false]"
  - "/execute as @p at @s run setblock ^0 ^0 ^5 minecraft:oak_door[facing=south,half=upper,hinge=left,open=false]"
  - "/execute as @p at @s run setblock ^0 ^-1 ^10 minecraft:chest[facing=south]"
